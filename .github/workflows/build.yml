name: Build Turnip NELL512 A10

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools ccache
          pip3 install --break-system-packages meson mako

      - name: Build
        run: |
          chmod +x turnip_builder.sh
          ./turnip_builder.sh

      - name: Upload raw build
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Raw
          path: turnip_workdir/Turnip-*.zip

      - name: Patch for Android 10
        continue-on-error: false
        run: |
          export PATH="$PWD/turnip_workdir/android-ndk-r28/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd turnip_workdir
          mkdir orig out
          unzip -q Turnip-*.zip -d orig
          python3 ../patch.py orig/vulkan.ad07XX.so out/vulkan.ad07XX.so patchwork
          cp orig/meta.json out/meta.json
          MESA_VER=$(head -n1 mesa/VERSION)
          NAME="Turnip v${MESA_VER} NELL512 A10 $(git -C mesa rev-parse --short HEAD)"
          echo "ART_NAME=Turnip v${MESA_VER} NELL512 A10 $(git -C mesa rev-parse --short HEAD) run${{ github.run_number }}" >> "$GITHUB_ENV"
          sed -i "s|\"name\": *\"[^\"]*\"|\"name\": \"$NAME\"|" out/meta.json
          sed -i "s|\"driverVersion\": *\"[^\"]*\"|\"driverVersion\": \"v${MESA_VER} NELL512 A10\"|" out/meta.json
          MESA_COMMIT=$(git -C mesa rev-parse --short HEAD)
          MESA_DATE=$(git -C mesa log -1 --format=%cs)
          MESA_MSG=$(git -C mesa log -1 --format=%s | tr -d '"\\|&' | cut -c1-80)
          sed -i "s|\"description\": *\"[^\"]*\"|\"description\": \"Mesa ${MESA_VER} (${MESA_COMMIT}, ${MESA_DATE}) - ${MESA_MSG}\"|" out/meta.json
          cat out/meta.json
          readelf -h out/vulkan.ad07XX.so | grep -q 'Number of section headers: *[1-9]' || { echo "ERROR: section headers hilang"; exit 1; }
          readelf -d out/vulkan.ad07XX.so | grep SONAME
          sha256sum out/vulkan.ad07XX.so
          (cd out && zip -9 -q ../Turnip-A10-Patched.zip vulkan.ad07XX.so meta.json)

      - name: Upload patched build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART_NAME }}
          path: turnip_workdir/Turnip-A10-Patched.zip
          if-no-files-found: error 
