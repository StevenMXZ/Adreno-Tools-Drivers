name: Build Turnip A10

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools
          pip3 install --break-system-packages meson mako

      - name: Build
        run: |
          chmod +x turnip_builder.sh
          ./turnip_builder.sh
      
      - name: Patch for Android 10
        run: |
          export PATH="$PWD/turnip_workdir/android-ndk-r28/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd turnip_workdir
          mkdir orig out
          unzip -q Turnip-*.zip -d orig
          python3 ../patch.py orig/vulkan.ad07XX.so out/vulkan.ad07XX.so patchwork
          cp orig/meta.json out/meta.json
          (cd out && zip -9 -q ../Turnip-A10-Patched.zip vulkan.ad07XX.so meta.json)
     
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Driver
          path: turnip_workdir/*.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: turnip_workdir/*.zip
