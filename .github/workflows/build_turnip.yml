name: Build Turnip Unified Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip flex bison git perl python3-pip glslang-tools curl zip
          pip3 install --break-system-packages meson mako
      - name: Build driver
        run: bash build_turnip.sh
      - uses: actions/upload-artifact@v4
        id: upload
        continue-on-error: true
        with:
          name: Turnip-v27.0.0-R3
          path: turnip_workdir/Turnip_v27.0.0-R3.zip
          if-no-files-found: error
      - name: Save ZIP in a private draft if artifact upload fails
        if: steps.upload.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=turnip_workdir/Turnip_v27.0.0-R3.zip
          unzip -tq "$archive"
          release_url=$(gh release create "ci-turnip-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$archive" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Turnip R3 build ${GITHUB_RUN_NUMBER}" \
            --notes "GitHub Actions could not store the build artifact. This draft contains the ZIP from the build.")
          printf '[Download the ZIP from the draft release](%s)\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
